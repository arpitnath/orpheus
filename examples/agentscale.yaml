# AgentScale Server Configuration Example
# This file demonstrates multi-agent deployment with different scaling policies

server:
  port: 8080
  autoscaler_interval: 10s
  isolation:
    enabled: true
    type: auto                        # auto-detect (namespace on Linux, VM on macOS)
    defaults:
      memory_limit: 512mb
      timeout: 300s                   # 5 minutes

agents:
  # Planning Agent - Balanced scaling for general use
  planning-agent:
    path: ./planning-agent
    scaling:
      min_workers: 2                  # Start with 2 warm workers
      max_workers: 10
      target_utilization: 2.0         # 2 tasks per worker ideal
      scale_up_threshold: 3.0         # Scale up when > 3 tasks/worker
      scale_down_threshold: 0.5       # Scale down when < 0.5 tasks/worker
      scale_up_delay: 15s
      scale_down_delay: 1m
      queue_size: 200
    isolation:
      memory_limit: 1gb               # Override: needs more memory for complex planning
      timeout: 600s                   # 10 minutes for longer operations

  # Simple Agent - Conservative scaling for low-traffic
  simple-agent:
    path: ./simple-agent
    scaling:
      min_workers: 1                  # Single worker sufficient
      max_workers: 5
      target_utilization: 3.0         # More tolerant of queueing
      scale_up_threshold: 4.0         # Scale up only when really needed
      scale_down_threshold: 0.5
      scale_up_delay: 30s             # Slower to scale up (save resources)
      scale_down_delay: 2m            # Slower to scale down
      queue_size: 50
    # No isolation override - use server defaults (512mb, 300s)
