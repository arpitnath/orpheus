name: rag-search
runtime: python3
module: rag_agent
entrypoint: handler

memory: 512
timeout: 600  # 10 min - LLM inference can be slow

# Model specification - ServiceManager handles everything
# Orpheus auto-detects: macOS → Ollama, Linux+GPU → vLLM
model: mistral

# Environment variables
env:
  - INDEX_DIR=/agent/data/faiss_index

# Scaling configuration
scaling:
  min_workers: 1
  max_workers: 20
  target_utilization: 1.5
  scale_up_threshold: 2.0
  scale_down_threshold: 0.3
  scale_up_delay: "15s"
  scale_down_delay: "60s"
  queue_size: 20
