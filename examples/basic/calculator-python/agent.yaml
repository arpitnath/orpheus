name: calculator-python
runtime: python3
module: calculator
entrypoint: handler
memory: 256
timeout: 180

# Environment variables
env:
    - OPENAI_API_KEY=${OPENAI_API_KEY}  # Set in your environment

# Telemetry configuration - custom labels for Prometheus filtering
telemetry:
  enabled: true
  labels:
    team: platform
    tier: basic
    use_case: math

# Scaling configuration
scaling:
    min_workers: 1
    max_workers: 50
    target_utilization: 1.5
    scale_up_threshold: 2.0
    scale_down_threshold: 0.3
    scale_up_delay: "10s"
    scale_down_delay: "30s"
    queue_size: 200
