name: gmail-automation
runtime: python3
module: agent
entrypoint: handler

# Memory configuration (increased for OpenAI Agents SDK + sessions)
memory: 512
memory_limit: 1024

# Timeout configuration (increased for OAuth flow)
timeout: 300
idle_timeout: 120

# Environment variables (resolved from local shell at deploy time)
env:
  - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
  - OPENAI_API_KEY=${OPENAI_API_KEY}
  - GMAIL_AUTH_CONFIG_ID=ac_zQq26WDiUZYI
