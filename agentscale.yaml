server:
  port: 8080
  autoscaler_interval: 10s
  isolation:
    enabled: true
    type: auto
    defaults:
      memory_limit: 512mb
      timeout: 300s
agents:
  calculator-agent:
    image: /Users/arpit/.agentscale/agents/calculator-agent
    scaling:
      min_workers: 1
      max_workers: 5
      target_utilization: 2.0
      scale_up_threshold: 3.0
      scale_down_threshold: 0.5
      scale_up_delay: 15s
      scale_down_delay: 1m
      queue_size: 100
