# AgentScale Lima VM Configuration
# https://lima-vm.io/docs/config/
#
# Usage:
#   limactl start ./lima/agentscale.yaml --name=agentscale
#   limactl shell agentscale
#   limactl stop agentscale

# VM Images (Ubuntu 24.04 LTS)
images:
  # ARM64 (Apple Silicon)
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  # AMD64 (Intel)
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

# VM Resources
cpus: 2
memory: "4GiB"
disk: "20GiB"

# Use Apple Virtualization.framework (fastest on macOS 13.5+)
vmType: "vz"

# VZ-specific options
vmOpts:
  vz:
    # Enable Rosetta for x86_64 binaries on ARM (optional)
    rosetta:
      enabled: true
      binfmt: true

# Firmware (UEFI for VZ)
firmware:
  legacyBIOS: false

# Network Configuration
networks:
  # Default user-mode networking (no root required)
  - vzNAT: true

# Audio (disabled for server workload)
audio:
  device: null

# Video (disabled for server workload)
video:
  display: "none"

# Host Directory Mounts
mounts:
  # Home directory (for agent code)
  - location: "~"
    writable: true
    sshfs:
      cache: true
      followSymlinks: true

# SSH Configuration
ssh:
  localPort: 0  # Random port
  loadDotSSHPubKeys: true
  forwardAgent: true

# Port Forwarding
portForwards:
  # Forward agentscale daemon socket
  - guestSocket: "/var/run/agentscale.sock"
    hostSocket: "{{.Dir}}/sock/agentscale.sock"

  # Forward TCP server port (for remote deployment and MCP)
  - guestPort: 7777
    hostPort: 7777

  # Forward metrics port (optional)
  - guestPort: 9090
    hostPort: 9090

# Containerd (we use runc directly, but containerd available if needed)
containerd:
  system: false
  user: false

# Provisioning Scripts
provision:
  # System-level setup (runs as root)
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail

      echo "=== AgentScale VM Provisioning ==="

      # Update package lists
      apt-get update

      # Install runc (OCI runtime)
      apt-get install -y runc

      # Verify runc
      runc --version

      # Install Python 3.10+
      apt-get install -y python3 python3-pip python3-venv

      # Verify Python
      python3 --version

      # Install common Python packages for agents
      pip3 install --break-system-packages \
        requests \
        httpx \
        openai \
        anthropic

      # Create agentscale directories
      mkdir -p /var/lib/agentscale/bundles
      mkdir -p /var/lib/agentscale/images
      mkdir -p /var/run/agentscale
      mkdir -p /etc/agentscale

      # Set permissions (allow lima user)
      chown -R $(id -u lima):$(id -g lima) /var/lib/agentscale
      chown -R $(id -u lima):$(id -g lima) /var/run/agentscale
      chown -R $(id -u lima):$(id -g lima) /etc/agentscale

      echo "=== Provisioning Complete ==="

  # User-level setup (runs as lima user)
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail

      echo "=== User Setup ==="
      echo "=== User Setup Complete ==="

# Probes (health checks)
probes:
  - description: "runc is installed"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      runc --version
    hint: |
      runc is not installed. Run:
        sudo apt-get install -y runc

  - description: "Python 3 is installed"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      python3 --version
    hint: |
      Python 3 is not installed. Run:
        sudo apt-get install -y python3

# Message displayed after VM starts
message: |
  AgentScale VM is ready!

  To run agents:
    agentscale run ./my-agent

  To SSH into VM:
    limactl shell agentscale

  Socket location:
    {{.Dir}}/sock/agentscale.sock
